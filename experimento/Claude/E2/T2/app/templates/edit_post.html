{% extends "base.html" %}
{% block title %}Editar postagem{% endblock %}
{% block content %}
  <section class="card">
    <h1>Editar postagem</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="content">Conteúdo</label>
      <textarea id="content" name="content" rows="5" maxlength="1000" required autofocus>{{ content }}</textarea>
      <button type="submit">Salvar</button>
      <a class="btn-link" href="{{ url_for('main.index') }}">Cancelar</a>
    </form>
  </section>
{% endblock %}
