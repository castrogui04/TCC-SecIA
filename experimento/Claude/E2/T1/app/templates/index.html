{% extends "base.html" %}
{% block title %}Início{% endblock %}
{% block content %}
  <section class="card">
    <h1>Página inicial</h1>
    <p>Você está autenticado como <strong>{{ g.user['username'] }}</strong>.</p>
    <p class="muted">Conta criada em {{ g.user['created_at'] }} (UTC).</p>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Sair</button>
    </form>
  </section>
{% endblock %}
