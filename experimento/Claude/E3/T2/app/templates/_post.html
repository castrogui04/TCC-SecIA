<article class="post">
  <header class="post-meta">
    <strong class="post-author">{{ post['author'] }}</strong>
    <span class="muted">
      · {{ post['created_at'] }}{% if post['updated_at'] %} (editado em {{ post['updated_at'] }}){% endif %}
    </span>
  </header>
  <p class="post-content">{{ post['content'] }}</p>
  {% if g.user and g.user['id'] == post['user_id'] %}
    <footer class="post-actions">
      <a class="button small secondary" href="{{ url_for('posts.edit', post_id=post['id']) }}">Editar</a>
      <a class="button small danger" href="{{ url_for('posts.delete', post_id=post['id']) }}">Excluir</a>
    </footer>
  {% endif %}
</article>
