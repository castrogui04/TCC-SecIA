{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <section class="card">
    <h1>Entrar</h1>
    <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}

      <label for="username">Nome de usuário</label>
      <input id="username" name="username" type="text" value="{{ username }}"
             required maxlength="30" autocomplete="username" autofocus>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password"
             required maxlength="128" autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
  </section>
{% endblock %}
