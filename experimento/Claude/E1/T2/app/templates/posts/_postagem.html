<article class="cartao postagem">
    <header class="postagem-cabecalho">
        <strong class="postagem-autor">{{ postagem['autor'] }}</strong>
        <span class="postagem-data">
            {{ postagem['criado_em'].strftime('%d/%m/%Y %H:%M') }} (UTC)
            {% if postagem['atualizado_em'] %} · editada{% endif %}
        </span>
    </header>

    <p class="postagem-conteudo">{{ postagem['conteudo'] }}</p>

    {% if g.user and g.user['id'] == postagem['autor_id'] %}
        <footer class="postagem-acoes">
            <a class="botao botao-pequeno botao-secundario"
               href="{{ url_for('posts.editar', post_id=postagem['id']) }}">Editar</a>
            <form action="{{ url_for('posts.excluir', post_id=postagem['id']) }}" method="post"
                  class="form-inline-acao"
                  onsubmit="return confirm('Excluir esta postagem?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="botao botao-pequeno botao-perigo">Excluir</button>
            </form>
        </footer>
    {% endif %}
</article>
