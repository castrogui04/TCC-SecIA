{% extends "base.html" %}
{% block content %}
  <h1>Bem-vindo à Minha Rede</h1>
  {% if g.user %}
    <p>Você está autenticado como <strong>{{ g.user['username'] }}</strong>.</p>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Sair</button>
    </form>
  {% else %}
    <p>Você não está autenticado.</p>
    <nav><a href="{{ url_for('login') }}">Entrar</a> · <a href="{{ url_for('register') }}">Criar conta</a></nav>
  {% endif %}
{% endblock %}
