{% extends "base.html" %}
{% block title %}Editar postagem | Minha Rede{% endblock %}
{% block content %}
  <h1>Editar postagem</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="content">Texto da postagem</label>
    <textarea id="content" name="content" rows="6" maxlength="2000" required>{{ content }}</textarea>
    <small>De 1 a 2000 caracteres.</small>
    <button type="submit">Salvar alterações</button>
  </form>
  <p><a href="{{ url_for('index') }}">Cancelar e voltar</a></p>
{% endblock %}
