{% extends "base.html" %}

{% block title %}Cadastrar - Rede Social{% endblock %}

{% block content %}
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 20px;">Criar Conta</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div>
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-success btn-full">Cadastrar</button>
        </form>
        <div class="muted-link">
            Já possui uma conta? <a href="{{ url_for('login') }}">Faça login</a>
        </div>
    </div>
{% endblock %}
