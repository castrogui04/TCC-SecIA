{% extends "base.html" %}

{% block title %}Entrar - Rede Social{% endblock %}

{% block content %}
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 20px;">Acessar Conta</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div>
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-full">Entrar</button>
        </form>
        <div class="muted-link">
            Não tem uma conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
        </div>
    </div>
{% endblock %}
