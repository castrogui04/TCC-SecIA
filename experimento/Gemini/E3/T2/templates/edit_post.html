{% extends 'base.html' %}

{% block title %}Editar Postagem - Rede Social{% endblock %}

{% block content %}
<div class="card">
    <h2>Editar Postagem</h2>
    <form method="POST" action="{{ url_for('edit_post', post_id=post['id']) }}">
        <div class="form-group">
            <label for="content">Conteúdo da Publicação</label>
            <textarea id="content" name="content" rows="5" required>{{ post['content'] }}</textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn-primary" style="border: none; cursor: pointer;">Salvar Alterações</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
