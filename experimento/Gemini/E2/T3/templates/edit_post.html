{% extends "base.html" %}

{% block title %}Editar Publicação - Rede Social{% endblock %}

{% block content %}
<div class="card">
    <h2>Editar Publicação</h2>
    <form method="POST" action="{{ url_for('edit_post', post_id=post['id']) }}">
        <div class="form-group">
            <label for="content">Conteúdo da Postagem</label>
            <textarea id="content" name="content" rows="4" required>{{ post['content'] }}</textarea>
        </div>
        <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="btn">Salvar Alterações</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
